<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>

    
    <!-- HEADER -->
    <header>
        <!-- Bouton retour -->
        <button onclick="location.href='index.html'" class="back-button">Retour</button>
        <div class="titre"> 
        <h1>🔥 Contactez nous </h1>
        </div>
    </header>

    <!-- SECTION CONTACT -->
    <section class="contact-section">
        <p>⚡ N'hésitez pas à nous envoyer un message ou à nous appeler directement </p>

        <div class="contact-wrapper">
            <!-- FORMULAIRE DE CONTACT -->
            <form action="https://formspree.io/f/xqapaenj" method="POST" class="contact-form">
                <div class="input-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn">Envoyer le Message</button>
            </form>

        </div>
        <br>
        <p> ⚠️ Ceci est une messagerie sérieuse et professionnelle.
            Tout mail inapproprié sera ignoré et sanctionné si nécessaire ⚠️ </p>
    </section>

</body>
</html>
